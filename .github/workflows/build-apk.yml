name: Build JustUs APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore debug keystore and print SHA-1
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub secret DEBUG_KEYSTORE_BASE64"
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from committed debug.keystore.base64"
          else
            echo "::warning::Missing DEBUG_KEYSTORE_BASE64 secret! Generating an ephemeral keystore — Google Sign-In SHA-1 will NOT match Firebase."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias|SHA1:|SHA256:" || true

      - name: Verify or restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GitHub secret GOOGLE_SERVICES_JSON"
            else
              echo "::error::Missing app/google-services.json! Push app/google-services.json or set GOOGLE_SERVICES_JSON in GitHub Secrets."
              exit 1
            fi
          else
            echo "Using committed app/google-services.json from repository"
          fi

          python3 - << 'PY'
          import json, subprocess, re
          out = subprocess.check_output(
              ["keytool", "-list", "-v", "-keystore", "debug.keystore", "-storepass", "android", "-alias", "androiddebugkey"],
              text=True
          )
          m = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", out)
          sha1_hex = m.group(1).replace(":", "").lower() if m else ""
          with open("app/google-services.json") as f:
              data = json.load(f)
          matched = False
          for client in data.get("client", []):
              pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              if pkg == "com.aistudio.pixora.k7m4xp":
                  for oc in client.get("oauth_client", []):
                      ch = oc.get("android_info", {}).get("certificate_hash", "").lower()
                      if ch == sha1_hex and sha1_hex:
                          matched = True
          print(f"Keystore SHA-1 hex: {sha1_hex}")
          print(f"google-services.json OAuth SHA-1 match for com.aistudio.pixora.k7m4xp: {matched}")
          if not matched:
              print("::warning::google-services.json certificate_hash does NOT match debug.keystore SHA-1! Google Sign-In may fail unless both debug.keystore.base64 and app/google-services.json are pushed (or update GOOGLE_SERVICES_JSON secret).")
          PY

      - name: Inject IMGBB_API_KEY from GitHub Secrets
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          if [ -n "$IMGBB_API_KEY" ]; then
            echo "IMGBB_API_KEY=$IMGBB_API_KEY" > .env
          else
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: justus-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
